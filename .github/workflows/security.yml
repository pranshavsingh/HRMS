name: HRMS Security Hardening CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'feat/**'
      - 'release/**'

jobs:
  backend-security:
    name: Backend Security, Migrations & Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password_strong_123
          MYSQL_DATABASE: hrms_ci_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot_ci_password_strong_123" --health-interval=10s --health-timeout=5s --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: node_backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd node_backend
          npm ci

      - name: Syntax & Structure Verification (npm run check)
        run: |
          cd node_backend
          npm run check

      - name: Dependency Vulnerability Audit
        run: |
          cd node_backend
          npm audit --audit-level=high

      - name: Initialize MySQL Schema on Disposable Database
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root_ci_password_strong_123
          MYSQL_DATABASE: hrms_ci_test
          DB_CLIENT: mysql
        run: |
          cd node_backend
          npm run db:init:mysql

      - name: Validate & Execute Database Migrations
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root_ci_password_strong_123
          MYSQL_DATABASE: hrms_ci_test
          DB_CLIENT: mysql
        run: |
          cd node_backend
          npm run db:migrate

      - name: Configure and Verify Production Redis Persistence (AOF & noeviction)
        run: |
          sudo apt-get install -y redis-tools || true
          redis-cli -h 127.0.0.1 -p 6379 config set appendonly yes
          redis-cli -h 127.0.0.1 -p 6379 config set appendfsync everysec
          redis-cli -h 127.0.0.1 -p 6379 config set maxmemory 512mb
          redis-cli -h 127.0.0.1 -p 6379 config set maxmemory-policy noeviction
          # Verify configuration
          AOF=$(redis-cli -h 127.0.0.1 -p 6379 config get appendonly | sed -n '2p')
          POLICY=$(redis-cli -h 127.0.0.1 -p 6379 config get maxmemory-policy | sed -n '2p')
          SYNC=$(redis-cli -h 127.0.0.1 -p 6379 config get appendfsync | sed -n '2p')
          echo "Redis appendonly: $AOF"
          echo "Redis maxmemory-policy: $POLICY"
          echo "Redis appendfsync: $SYNC"
          test "$AOF" = "yes"
          test "$POLICY" = "noeviction"
          test "$SYNC" = "everysec"

      - name: Run Automated Security Test Suite
        env:
          NODE_ENV: test
          JWT_SECRET: super_secure_ci_test_jwt_secret_with_32_characters_min
          OTP_SECRET: super_secure_ci_test_otp_secret_with_32_characters_min
          CORS_ORIGIN: http://localhost:5173,http://localhost:3000
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root_ci_password_strong_123
          MYSQL_DATABASE: hrms_ci_test
          MYSQL_CONNECTION_LIMIT: 30
          DB_CLIENT: mysql
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_URL: redis://127.0.0.1:6379
          QUEUE_REDIS_URL: redis://127.0.0.1:6379
          OUTBOX_ENCRYPTION_KEY: 7e3c3fd7e9992ed3e0827cd4619e8edd4c531353efdf2e751a797378c7741852
          ENFORCE_ALL_SECURITY_TESTS: "true"
        run: |
          cd node_backend
          npm run test:security

      - name: Run Phase 2 Concurrency Tests

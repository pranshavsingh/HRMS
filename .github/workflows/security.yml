  frontend-build:
    name: Frontend Quality & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: hrms_saas/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd hrms_saas
          npm ci

      - name: ESLint Code Quality Gate (0 Errors)
        run: |
          cd hrms_saas
          npm run lint

      - name: Build React + Vite Web App
        run: |
          cd hrms_saas
          npm run build

  mobile-build:
    name: Mobile Client Verification (TypeScript & Bundle)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: hrms_mobile/package-lock.json

      - name: Install mobile dependencies
        run: |
          cd hrms_mobile
          npm ci

      - name: TypeScript Static Verification
        run: |
          cd hrms_mobile
          npx tsc --noEmit

      - name: Export Expo Static Android Bundle
        env:
          EXPO_PUBLIC_API_URL: https://api.hrms.internal/api
        run: |
          cd hrms_mobile
          npx expo export --platform android

  docker-validation:
    name: Docker Container & Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-security, frontend-build]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Production Docker Compose Configuration
        run: |
          docker compose -f docker-compose.prod.yml config

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./node_backend
          file: ./node_backend/Dockerfile
          push: false
          tags: hrms-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./hrms_saas
          file: ./hrms_saas/Dockerfile
          push: false
          tags: hrms-frontend:ci-test

  deploy-production:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: [backend-security, frontend-build, docker-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to VPS via SSH or Webhook
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          TARGET_HOST="${VPS_HOST:-201.18.198.223}"
          TARGET_USER="${VPS_USER:-root}"

          if [ -n "$VPS_SSH_KEY" ]; then
            echo "Deploying to VPS ($TARGET_USER@$TARGET_HOST) via SSH..."
            mkdir -p ~/.ssh
            echo "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$TARGET_USER@$TARGET_HOST" "chmod +x /opt/hrms/scripts/deploy_production.sh && bash /opt/hrms/scripts/deploy_production.sh"
            echo "✅ Production deployment via SSH completed successfully!"
          elif [ -n "$COOLIFY_WEBHOOK" ]; then
            echo "VPS_SSH_KEY not set. Falling back to Coolify Webhook..."
            TARGET_URL="${COOLIFY_WEBHOOK/force=false/force=true}"
            echo "Triggering Coolify production deployment..."
            if [ -n "$COOLIFY_TOKEN" ]; then
              RESPONSE=$(curl -s -w "\n%{http_code}" -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$TARGET_URL")
            else
              RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$TARGET_URL")
            fi
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "Coolify response: $BODY (HTTP $HTTP_STATUS)"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Coolify deployment webhook triggered successfully!"
            else
              echo "❌ Deployment webhook failed with HTTP status $HTTP_STATUS"
              exit 1
            fi
          else
            echo "::error ::Neither VPS_SSH_KEY nor COOLIFY_WEBHOOK_URL secret is configured. Please add VPS_SSH_KEY to Settings -> Secrets and variables -> Actions."
            exit 1
          fi

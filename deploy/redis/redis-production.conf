################################################################################
# HRMS SaaS Distributed Backend — Production Redis Configuration
# Optimized for BullMQ Durable Queues, Socket.IO Pub/Sub & Application Caching
################################################################################

# 1. Network & General Configuration
bind 127.0.0.1 ::1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
supervised systemd
loglevel notice
logfile /var/log/redis/redis-server.log
databases 16

# 2. Persistence — Hybrid AOF + RDB (Bounded Recovery Window & Queue Durability)
# Note: True Zero Business Data Loss is guaranteed by the MySQL Transactional Outbox Pattern.
# RDB Snapshots (periodic point-in-time state backups)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /var/lib/redis

# Append Only File (AOF - transaction log with fsync every second)
# Provides bounded recovery window: maximum 1 second of data loss during catastrophic power failure
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# 3. Memory Management & Eviction Safeguards
# CRITICAL FOR BULLMQ: BullMQ queue metadata, jobs, and delayed sets must NEVER be evicted!
# Evicting queue keys corrupts job state. 'noeviction' ensures Redis returns memory errors
# rather than silently dropping background jobs.
maxmemory 512mb
maxmemory-policy noeviction

# 4. Latency & Performance Tuning
lazyfree-lazy-eviction no
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# 5. Security & Authentication (Configure in environment)
# requirepass <STRONG_PRODUCTION_REDIS_PASSWORD>
